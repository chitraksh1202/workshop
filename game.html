<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pong — 2 Players</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&family=Inter:wght@500;600&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Space Grotesk', sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* ── MENU ── */
    #menu {
      text-align: center;
      animation: up 0.4s ease;
    }

    @keyframes up { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

    #menu h1 {
      font-size: 5rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: -2px;
      margin-bottom: 8px;
    }

    #menu p { color: #444; font-size: 1rem; margin-bottom: 48px; font-family: 'Inter', sans-serif; }

    .controls-row {
      display: flex;
      gap: 40px;
      justify-content: center;
      margin-bottom: 48px;
    }

    .ctrl-box {
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 20px 28px;
      text-align: center;
    }

    .ctrl-label { font-size: 0.7rem; color: #444; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; font-family:'Inter',sans-serif; }
    .ctrl-player { font-size: 1rem; font-weight: 700; color: #fff; margin-bottom: 10px; }
    .ctrl-player.left  { color: #4f8eff; }
    .ctrl-player.right { color: #ff4f4f; }

    .key-pair { display: flex; gap: 8px; justify-content: center; }

    kbd {
      background: #1a1a1a;
      border: 1px solid #333;
      border-bottom: 3px solid #333;
      border-radius: 6px;
      padding: 6px 12px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.9rem;
      color: #ccc;
    }

    .play-btn {
      background: #fff;
      color: #000;
      border: none;
      padding: 16px 60px;
      border-radius: 50px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.15s;
    }

    .play-btn:hover { background: #ddd; transform: scale(1.04); }

    .win-to { color: #333; font-size: 0.8rem; font-family:'Inter',sans-serif; margin-top: 16px; }

    /* ── GAME ── */
    #game { display: none; flex-direction: column; align-items: center; gap: 16px; }

    .hud {
      display: flex;
      align-items: center;
      gap: 60px;
      width: 760px;
    }

    .hud-player {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .hud-player.right { align-items: flex-end; text-align: right; }

    .hud-name { font-size: 0.7rem; color: #333; letter-spacing: 2px; text-transform: uppercase; font-family:'Inter',sans-serif; margin-bottom: 4px; }
    .hud-score { font-size: 3.5rem; font-weight: 900; color: #fff; line-height: 1; }
    .hud-score.left-score  { color: #4f8eff; }
    .hud-score.right-score { color: #ff4f4f; }

    .hud-center { text-align: center; }
    .hud-info { font-size: 0.75rem; color: #333; font-family:'Inter',sans-serif; }

    canvas {
      border-radius: 8px;
      display: block;
      background: #000;
    }

    .hint { color: #2a2a2a; font-size: 0.75rem; font-family:'Inter',sans-serif; letter-spacing: 1px; }

    /* ── WIN ── */
    #win-screen {
      display: none;
      text-align: center;
      animation: up 0.4s ease;
    }

    #win-screen h2 { font-size: 3.5rem; font-weight: 900; color: #fff; margin-bottom: 8px; }
    #win-screen p  { color: #444; font-family:'Inter',sans-serif; margin-bottom: 40px; }

    .final-row { display: flex; gap: 20px; justify-content: center; margin-bottom: 40px; }

    .final-box {
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 24px 40px;
      text-align: center;
    }

    .final-box.winner { border-color: #fff; box-shadow: 0 0 30px rgba(255,255,255,0.08); }
    .final-box-name   { font-size: 0.7rem; color: #444; letter-spacing: 2px; text-transform: uppercase; font-family:'Inter',sans-serif; margin-bottom: 8px; }
    .final-box-score  { font-size: 3rem; font-weight: 900; color: #fff; }
    .final-box-score.blue { color: #4f8eff; }
    .final-box-score.red  { color: #ff4f4f; }

    .btn-row { display: flex; gap: 12px; justify-content: center; }

    .rematch-btn {
      background: #fff;
      color: #000;
      border: none;
      padding: 13px 36px;
      border-radius: 50px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .rematch-btn:hover { background: #ddd; }

    .menu-btn {
      background: transparent;
      color: #444;
      border: 1px solid #222;
      padding: 13px 28px;
      border-radius: 50px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .menu-btn:hover { color: #fff; border-color: #444; }

    /* ── PARTICLES ── */
    .prt {
      position: fixed;
      pointer-events: none;
      border-radius: 50%;
      animation: pfall 1.4s ease-out forwards;
      z-index: 99;
    }
    @keyframes pfall { 0%{opacity:1;transform:translateY(0) rotate(0)} 100%{opacity:0;transform:translateY(500px) rotate(600deg)} }
  </style>
</head>
<body>

<!-- MENU -->
<div id="menu">
  <h1>PONG</h1>
  <p>First to 7 wins</p>

  <div class="controls-row">
    <div class="ctrl-box">
      <div class="ctrl-label">Left Player</div>
      <div class="ctrl-player left">Player 1</div>
      <div class="key-pair"><kbd>W</kbd><kbd>S</kbd></div>
    </div>
    <div class="ctrl-box">
      <div class="ctrl-label">Right Player</div>
      <div class="ctrl-player right">Player 2</div>
      <div class="key-pair"><kbd>↑</kbd><kbd>↓</kbd></div>
    </div>
  </div>

  <button class="play-btn" onclick="startGame()">PLAY</button>
  <div class="win-to">First to 7 wins · ESC to pause</div>
</div>

<!-- GAME -->
<div id="game">
  <div class="hud">
    <div class="hud-player left">
      <div class="hud-name">Player 1</div>
      <div class="hud-score left-score" id="s1">0</div>
    </div>
    <div class="hud-center">
      <div class="hud-info" id="hud-info">— vs —</div>
    </div>
    <div class="hud-player right">
      <div class="hud-name">Player 2</div>
      <div class="hud-score right-score" id="s2">0</div>
    </div>
  </div>
  <canvas id="c" width="760" height="480"></canvas>
  <div class="hint">W / S · · · ESC pause · · · ↑ / ↓</div>
</div>

<!-- WIN -->
<div id="win-screen">
  <h2 id="win-title">Player 1 Wins!</h2>
  <p id="win-sub">GG</p>
  <div class="final-row">
    <div class="final-box" id="fb1">
      <div class="final-box-name">Player 1</div>
      <div class="final-box-score blue" id="fs1">0</div>
    </div>
    <div class="final-box" id="fb2">
      <div class="final-box-name">Player 2</div>
      <div class="final-box-score red" id="fs2">0</div>
    </div>
  </div>
  <div class="btn-row">
    <button class="rematch-btn" onclick="rematch()">↺ Rematch</button>
    <button class="menu-btn" onclick="goMenu()">Menu</button>
  </div>
</div>

<script>
const WIN = 7;
const cv  = document.getElementById('c');
const ctx = cv.getContext('2d');
const W   = cv.width, H = cv.height;

// ── GAME STATE ────────────────────────────────────────────
const PAD_W = 12, PAD_H = 80, PAD_SPEED = 6, BALL_R = 9;
const INIT_SPEED = 5;

let score1, score2, paused, running, animId;
let paddle1, paddle2, ball, keys, particles;
let countdown, cdVal;

function initState() {
  paddle1 = { x: 20,       y: H/2 - PAD_H/2, dy: 0 };
  paddle2 = { x: W-20-PAD_W, y: H/2 - PAD_H/2, dy: 0 };
  ball    = resetBall();
  keys    = {};
  particles = [];
  paused  = false;
}

function resetBall(scorer) {
  const angle  = (Math.random() * 60 - 30) * Math.PI / 180;
  const dir    = scorer === 1 ? 1 : scorer === 2 ? -1 : (Math.random() > .5 ? 1 : -1);
  return {
    x: W/2, y: H/2,
    vx: dir * INIT_SPEED * Math.cos(angle),
    vy: INIT_SPEED * Math.sin(angle),
    speed: INIT_SPEED,
    trail: []
  };
}

// ── SCREENS ───────────────────────────────────────────────
function show(id) {
  ['menu','game','win-screen'].forEach(s => {
    document.getElementById(s).style.display = 'none';
  });
  document.getElementById(id).style.display = id==='game' ? 'flex' : 'block';
}

function startGame() {
  score1 = 0; score2 = 0;
  show('game');
  updateHUD();
  initState();
  startCountdown(3, () => { running = true; loop(); });
}

function rematch() { startGame(); }

function goMenu() {
  running = false;
  cancelAnimationFrame(animId);
  clearTimeout(countdown);
  show('menu');
}

// ── COUNTDOWN ─────────────────────────────────────────────
function startCountdown(n, cb) {
  running = false;
  cdVal = n;
  document.getElementById('hud-info').textContent = n;
  if (n <= 0) { document.getElementById('hud-info').textContent = 'GO!'; setTimeout(cb, 400); return; }
  countdown = setTimeout(() => startCountdown(n-1, cb), 900);
}

// ── MAIN LOOP ─────────────────────────────────────────────
function loop() {
  if (!running) return;
  update();
  render();
  animId = requestAnimationFrame(loop);
}

function update() {
  if (paused) return;

  // Paddles
  if (keys['w'] || keys['W']) paddle1.y -= PAD_SPEED;
  if (keys['s'] || keys['S']) paddle1.y += PAD_SPEED;
  if (keys['ArrowUp'])   paddle2.y -= PAD_SPEED;
  if (keys['ArrowDown']) paddle2.y += PAD_SPEED;

  paddle1.y = clamp(paddle1.y, 0, H - PAD_H);
  paddle2.y = clamp(paddle2.y, 0, H - PAD_H);

  // Ball trail
  ball.trail.push({ x: ball.x, y: ball.y });
  if (ball.trail.length > 10) ball.trail.shift();

  // Ball move
  ball.x += ball.vx;
  ball.y += ball.vy;

  // Wall bounce (top/bottom)
  if (ball.y - BALL_R <= 0) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); }
  if (ball.y + BALL_R >= H) { ball.y = H - BALL_R; ball.vy = -Math.abs(ball.vy); }

  // Paddle 1 collision
  if (ball.vx < 0 &&
      ball.x - BALL_R <= paddle1.x + PAD_W &&
      ball.x - BALL_R >= paddle1.x &&
      ball.y >= paddle1.y && ball.y <= paddle1.y + PAD_H) {
    deflect(ball, paddle1, 1);
  }

  // Paddle 2 collision
  if (ball.vx > 0 &&
      ball.x + BALL_R >= paddle2.x &&
      ball.x + BALL_R <= paddle2.x + PAD_W &&
      ball.y >= paddle2.y && ball.y <= paddle2.y + PAD_H) {
    deflect(ball, paddle2, -1);
  }

  // Score
  if (ball.x + BALL_R < 0)  { score2++; scored(2); }
  if (ball.x - BALL_R > W)  { score1++; scored(1); }

  // Particles
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.life--; p.vy+=0.15; });
}

function deflect(ball, pad, dir) {
  const rel   = (ball.y - (pad.y + PAD_H/2)) / (PAD_H/2);
  const angle = rel * 60 * Math.PI / 180;
  ball.speed  = Math.min(ball.speed + 0.4, 16);
  ball.vx     = dir * ball.speed * Math.cos(angle);
  ball.vy     = ball.speed * Math.sin(angle);
  spawnParticles(ball.x, ball.y, dir === 1 ? '#4f8eff' : '#ff4f4f', 8);
}

function scored(player) {
  updateHUD();
  spawnParticles(W/2, H/2, player===1 ? '#4f8eff' : '#ff4f4f', 30);
  confettiBurst(player===1 ? '#4f8eff' : '#ff4f4f');
  if (score1 >= WIN || score2 >= WIN) {
    running = false;
    cancelAnimationFrame(animId);
    setTimeout(() => showWin(), 600);
    return;
  }
  running = false;
  ball = resetBall(player===1 ? 2 : 1);
  startCountdown(2, () => { running = true; loop(); });
}

function showWin() {
  const winner = score1 >= WIN ? 'Player 1' : 'Player 2';
  document.getElementById('win-title').textContent = `${winner} Wins!`;
  document.getElementById('win-sub').textContent   = `${score1} — ${score2} · Great game!`;
  document.getElementById('fs1').textContent = score1;
  document.getElementById('fs2').textContent = score2;
  document.getElementById('fb1').className = 'final-box' + (score1 > score2 ? ' winner' : '');
  document.getElementById('fb2').className = 'final-box' + (score2 > score1 ? ' winner' : '');
  show('win-screen');
}

// ── RENDER ────────────────────────────────────────────────
function render() {
  ctx.clearRect(0, 0, W, H);

  // Center line
  ctx.setLineDash([8, 12]);
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(W/2, 0);
  ctx.lineTo(W/2, H);
  ctx.stroke();
  ctx.setLineDash([]);

  // Ball trail
  ball.trail.forEach((p, i) => {
    const alpha = (i / ball.trail.length) * 0.25;
    const r     = BALL_R * (i / ball.trail.length) * 0.7;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fill();
  });

  // Ball
  const grd = ctx.createRadialGradient(ball.x - 3, ball.y - 3, 1, ball.x, ball.y, BALL_R);
  grd.addColorStop(0, '#fff');
  grd.addColorStop(1, '#aaa');
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2);
  ctx.fillStyle = grd;
  ctx.fill();

  // Paddles
  drawPaddle(paddle1.x, paddle1.y, '#4f8eff');
  drawPaddle(paddle2.x, paddle2.y, '#ff4f4f');

  // Canvas particles
  particles.forEach(p => {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fillStyle = p.color;
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Pause overlay
  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 32px Space Grotesk';
    ctx.textAlign = 'center';
    ctx.fillText('PAUSED', W/2, H/2 - 10);
    ctx.font = '14px Inter';
    ctx.fillStyle = '#444';
    ctx.fillText('Press ESC to resume', W/2, H/2 + 24);
    ctx.textAlign = 'left';
  }
}

function drawPaddle(x, y, color) {
  const r = 6;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + PAD_W, y, x + PAD_W, y + PAD_H, r);
  ctx.arcTo(x + PAD_W, y + PAD_H, x, y + PAD_H, r);
  ctx.arcTo(x, y + PAD_H, x, y, r);
  ctx.arcTo(x, y, x + PAD_W, y, r);
  ctx.closePath();
  const g = ctx.createLinearGradient(x, y, x + PAD_W, y);
  g.addColorStop(0, color + 'cc');
  g.addColorStop(1, color);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.shadowColor = color;
  ctx.shadowBlur = 14;
  ctx.fill();
  ctx.shadowBlur = 0;
}

// ── HELPERS ───────────────────────────────────────────────
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

function spawnParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 4 + 1;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2,
      r: Math.random() * 4 + 2,
      color,
      life: 30, maxLife: 30
    });
  }
}

function confettiBurst(color) {
  const extras = ['#fff', '#f0c040', color];
  for (let i = 0; i < 40; i++) {
    setTimeout(() => {
      const p = document.createElement('div');
      const s = Math.random() * 10 + 5;
      p.className = 'prt';
      p.style.cssText = `width:${s}px;height:${s}px;background:${extras[Math.floor(Math.random()*extras.length)]};left:${Math.random()*100}vw;top:-10px;border-radius:${Math.random()>.5?'50%':'2px'}`;
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1500);
    }, i * 15);
  }
}

function updateHUD() {
  document.getElementById('s1').textContent = score1;
  document.getElementById('s2').textContent = score2;
  document.getElementById('hud-info').textContent = '— vs —';
}

// ── INPUT ─────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') e.preventDefault();
  if (e.key === 'Escape' && running) { paused = !paused; }
});

document.addEventListener('keyup', e => { keys[e.key] = false; });
</script>
</body>
</html>
