<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Battle — 2 Players</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:     #080810;
      --surface:#10101e;
      --border: rgba(255,255,255,0.07);
      --p1:     #6c63ff;
      --p2:     #ff3d5a;
      --gold:   #f0c040;
      --text:   #e8e8f0;
      --muted:  #5a5a78;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(108,99,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(108,99,255,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    .screen { display: none; width: 100%; max-width: 780px; padding: 24px; position: relative; z-index: 1; animation: up 0.3s ease; }
    .screen.active { display: block; }
    @keyframes up { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

    /* ── LOBBY ── */
    .lobby-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.8rem;
      font-weight: 900;
      text-align: center;
      color: #fff;
      margin-bottom: 6px;
    }

    .lobby-sub { text-align: center; color: var(--muted); font-size: 0.9rem; margin-bottom: 40px; }

    .player-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 32px; }

    .player-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
    }

    .player-box.p1 { border-top: 3px solid var(--p1); }
    .player-box.p2 { border-top: 3px solid var(--p2); }

    .player-box label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .p1 label { color: var(--p1); }
    .p2 label { color: var(--p2); }

    .player-box input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      outline: none;
      transition: border-color 0.15s;
    }

    .p1 input:focus { border-color: var(--p1); }
    .p2 input:focus { border-color: var(--p2); }

    .key-hint { font-size: 0.75rem; color: var(--muted); margin-top: 10px; }
    .key-hint kbd {
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 7px;
      font-family: monospace;
      font-size: 0.85rem;
      color: var(--text);
    }

    .start-btn {
      display: block;
      width: 100%;
      padding: 16px;
      background: var(--p1);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 1px;
    }

    .start-btn:hover { background: #7c74ff; box-shadow: 0 0 24px rgba(108,99,255,0.5); }

    /* ── SCOREBOARD ── */
    .scoreboard {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 16px;
      align-items: center;
      margin-bottom: 28px;
    }

    .score-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      text-align: center;
      transition: all 0.25s;
    }

    .score-card.buzzing { transform: scale(1.04); }
    .score-card.p1c  { border-color: var(--p1); box-shadow: 0 0 20px rgba(108,99,255,0.3); }
    .score-card.p2c  { border-color: var(--p2); box-shadow: 0 0 20px rgba(255,61,90,0.3); }

    .score-name { font-size: 0.8rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
    .p1 .score-name, .score-card.p1c .score-name { color: var(--p1); }
    .p2 .score-name, .score-card.p2c .score-name { color: var(--p2); }
    .score-num { font-family: 'Space Grotesk', sans-serif; font-size: 3.5rem; font-weight: 900; color: #fff; line-height: 1; }
    .score-key { font-size: 0.72rem; color: var(--muted); margin-top: 6px; }
    .score-key kbd { background:rgba(255,255,255,0.06); border:1px solid var(--border); border-radius:3px; padding:1px 6px; font-family:monospace; color:var(--text); }

    .vs-block { text-align: center; }
    .vs-text  { font-family:'Space Grotesk',sans-serif; font-size:1.4rem; font-weight:900; color:var(--muted); }
    .round-info { font-size:0.75rem; color:var(--muted); margin-top:4px; }

    /* ── QUESTION CARD ── */
    .q-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .q-card.locked-p1 { border-color: var(--p1); }
    .q-card.locked-p2 { border-color: var(--p2); }

    .q-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--p1), var(--p2));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.4s ease;
    }

    .q-card.buzz-active::before { transform: scaleX(1); }

    .q-cat { font-size: 0.72rem; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
    #question { font-size: 1.15rem; font-weight: 600; color: #fff; line-height: 1.6; margin-bottom: 24px; }

    .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .opt {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 13px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 0.875rem;
      font-weight: 500;
      text-align: left;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .opt .key-badge {
      background: rgba(255,255,255,0.07);
      border-radius: 4px;
      padding: 1px 7px;
      font-size: 0.75rem;
      font-family: monospace;
      color: var(--muted);
      flex-shrink: 0;
    }

    .opt:hover   { border-color: rgba(255,255,255,0.2); color: #fff; }
    .opt.correct { border-color: #22c55e; background: rgba(34,197,94,0.12); color: #22c55e; }
    .opt.wrong   { border-color: var(--p2); background: rgba(255,61,90,0.1); color: var(--p2); }
    .opt:disabled{ cursor: default; }

    /* ── STATUS BAR ── */
    .status-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 0.875rem;
      font-weight: 600;
      text-align: center;
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      animation: blink 1s ease-in-out infinite;
    }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* ── TIMER ── */
    .timer-track { height: 3px; background: var(--border); border-radius: 2px; margin-bottom: 20px; overflow: hidden; }
    #timer-fill  { height: 100%; width: 100%; background: linear-gradient(90deg,var(--p1),var(--p2)); transition: width 0.1s linear; }

    /* ── WIN SCREEN ── */
    .win-wrap { text-align: center; padding: 20px; }

    .win-crown { font-size: 4rem; margin-bottom: 16px; animation: bounce 0.6s ease infinite alternate; }
    @keyframes bounce { to { transform: translateY(-10px); } }

    .win-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 3rem;
      font-weight: 900;
      color: #fff;
      margin-bottom: 8px;
    }

    .win-sub { color: var(--muted); font-size: 0.95rem; margin-bottom: 36px; }

    .final-scores {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      max-width: 400px;
      margin: 0 auto 36px;
    }

    .final-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }

    .final-card.winner { border-color: var(--gold); box-shadow: 0 0 24px rgba(240,192,64,0.2); }
    .final-card-name { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; }
    .final-card-score { font-family:'Space Grotesk',sans-serif; font-size:3rem; font-weight:900; color:#fff; }

    .rematch-btn {
      padding: 14px 40px;
      background: var(--p1);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      margin-right: 12px;
    }

    .rematch-btn:hover { background: #7c74ff; box-shadow: 0 0 20px rgba(108,99,255,0.5); }

    .lobby-btn {
      padding: 14px 32px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .lobby-btn:hover { border-color: rgba(255,255,255,0.25); }

    /* ── PARTICLES ── */
    .prt {
      position: fixed;
      pointer-events: none;
      border-radius: 50%;
      animation: pfall 1.5s ease-out forwards;
      z-index: 999;
    }
    @keyframes pfall { 0%{opacity:1;transform:translateY(0) rotate(0)} 100%{opacity:0;transform:translateY(500px) rotate(600deg)} }
  </style>
</head>
<body>

<!-- LOBBY -->
<div class="screen active" id="s-lobby">
  <div class="lobby-title">⚔️ Anime Battle</div>
  <div class="lobby-sub">2-player anime quiz — first to 7 points wins</div>

  <div class="player-inputs">
    <div class="player-box p1">
      <label>Player 1</label>
      <input id="p1-name" type="text" placeholder="Enter name..." maxlength="16" value="Player 1" />
      <div class="key-hint">Buzz in with <kbd>Q</kbd> — answer with <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> <kbd>4</kbd></div>
    </div>
    <div class="player-box p2">
      <label>Player 2</label>
      <input id="p2-name" type="text" placeholder="Enter name..." maxlength="16" value="Player 2" />
      <div class="key-hint">Buzz in with <kbd>P</kbd> — answer with <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> <kbd>4</kbd></div>
    </div>
  </div>

  <button class="start-btn" onclick="startGame()">START BATTLE</button>
</div>

<!-- GAME -->
<div class="screen" id="s-game">
  <div class="scoreboard">
    <div class="score-card" id="sc1">
      <div class="score-name" id="sc1-name">Player 1</div>
      <div class="score-num" id="sc1-num">0</div>
      <div class="score-key">Buzz: <kbd>Q</kbd></div>
    </div>
    <div class="vs-block">
      <div class="vs-text">VS</div>
      <div class="round-info" id="round-info">Round 1</div>
    </div>
    <div class="score-card" id="sc2">
      <div class="score-name" id="sc2-name">Player 2</div>
      <div class="score-num" id="sc2-num">0</div>
      <div class="score-key">Buzz: <kbd>P</kbd></div>
    </div>
  </div>

  <div class="status-bar" id="status-bar">
    <div class="dot" style="background:#6c63ff"></div>
    Press Q or P to buzz in!
  </div>

  <div class="q-card" id="q-card">
    <div class="timer-track"><div id="timer-fill"></div></div>
    <div class="q-cat" id="q-cat">—</div>
    <div id="question">Loading...</div>
    <div class="options" id="opts"></div>
  </div>
</div>

<!-- WIN -->
<div class="screen" id="s-win">
  <div class="win-wrap">
    <div class="win-crown">👑</div>
    <div class="win-name" id="win-name">Player 1 Wins!</div>
    <div class="win-sub" id="win-sub">Congratulations</div>
    <div class="final-scores">
      <div class="final-card" id="fc1">
        <div class="final-card-name" id="fc1-name">P1</div>
        <div class="final-card-score" id="fc1-score">0</div>
      </div>
      <div class="final-card" id="fc2">
        <div class="final-card-name" id="fc2-name">P2</div>
        <div class="final-card-score" id="fc2-score">0</div>
      </div>
    </div>
    <button class="rematch-btn" onclick="rematch()">↺ Rematch</button>
    <button class="lobby-btn" onclick="goLobby()">Change Names</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {cat:'Naruto',          q:'What is the name of Kakashi\'s signature technique that he copied?',                                  a:['Shadow Clone Jutsu','Chidori','Kamui','Rasengan'],                                       c:1},
  {cat:'Naruto',          q:'Which tailed beast is sealed inside Gaara of the Sand?',                                             a:['Five-Tails','Three-Tails','One-Tail (Shukaku)','Seven-Tails'],                           c:2},
  {cat:'Naruto Shippuden',q:'What is Tobi\'s real identity?',                                                                     a:['Izuna Uchiha','Obito Uchiha','Madara Uchiha','Black Zetsu'],                             c:1},
  {cat:'Death Note',      q:'What rule means a human who uses the Death Note goes to neither heaven nor hell?',                    a:['Mu Rule','The 13-Day Rule','Nothingness Rule','Shinigami Law'],                          c:0},
  {cat:'Death Note',      q:'Who ultimately defeats Light Yagami?',                                                               a:['L','Mello','Near','Ryuk'],                                                               c:2},
  {cat:'Attack on Titan', q:'Who was the original holder of the War Hammer Titan?',                                               a:['Willy Tybur','Lara Tybur','Zeke Yeager','Reiner Braun'],                                 c:1},
  {cat:'Attack on Titan', q:'What is the ability that lets Titans coordinate without the Founding Titan\'s scream?',              a:['Beast Titan\'s Roar','Paths','Coordinate','Warrior Bond'],                              c:1},
  {cat:'One Piece',       q:'What is Brook\'s Devil Fruit called?',                                                               a:['Ghost-Ghost Fruit','Soul-Soul Fruit','Revive-Revive Fruit','Dead-Dead Fruit'],           c:2},
  {cat:'One Piece',       q:'What Haki type lets you see slightly into the future?',                                              a:['Conqueror\'s Haki','Armament Haki','Advanced Observation Haki','Supreme Haki'],         c:2},
  {cat:'Jujutsu Kaisen',  q:'What is the name of Megumi\'s strongest shikigami that destroys itself on summoning?',               a:['Eight-Handled Sword','Nue','Mahoraga','Divine Dog'],                                     c:2},
  {cat:'Jujutsu Kaisen',  q:'What technique combines Red and Blue to create Hollow Purple?',                                      a:['Reversed Cursed Technique','Amplification','Limitless — Hollow Purple','Black Flash'],  c:2},
  {cat:'Demon Slayer',    q:'What breathing form do all other breathing styles originate from?',                                  a:['Flame Breathing','Water Breathing','Sun Breathing','Moon Breathing'],                    c:2},
  {cat:'Demon Slayer',    q:'Which Upper Moon defeated both Tengen Uzui and the demon siblings Daki & Gyutaro?',                  a:['Upper Moon 1','Upper Moon 2','Upper Moon 3','Upper Moon 4'],                            c:1},
  {cat:'Hunter × Hunter', q:'What type of Nen does Killua primarily use?',                                                        a:['Enhancer','Emitter','Transmuter','Manipulator'],                                         c:2},
  {cat:'Hunter × Hunter', q:'What is Gon\'s final transformation called that ages his body to its peak?',                         a:['Nen Surge','Jajanken Limit','Adult Gon Transformation','Ultra Instinct'],               c:2},
  {cat:'FMA: Brotherhood',q:'What is the one thing alchemy cannot do according to the law of equivalent exchange?',               a:['Create gold','Transmute a human soul','Heal all wounds','Alter the weather'],           c:1},
  {cat:'FMA: Brotherhood',q:'Which homunculus has the goal of becoming a perfect being by absorbing God?',                        a:['Pride','Greed','Father','Envy'],                                                         c:2},
  {cat:'Dragon Ball Z',   q:'What is Frieza\'s stated power level in his final form?',                                            a:['530,000','1,000,000','120,000,000','5,000,000'],                                         c:1},
  {cat:'Dragon Ball Z',   q:'Who was the first character to achieve Super Saiyan 2?',                                             a:['Goku','Vegeta','Gohan','Future Trunks'],                                                 c:2},
  {cat:'Bleach',          q:'What is the name and ability of Aizen\'s zanpakuto?',                                                a:['Kyoka Suigetsu — complete hypnosis','Ryujin Jakka — fire','Senbonzakura — petals','Zangetsu — getsuga'], c:0},
  {cat:'My Hero Academia',q:'What is the name of the original wielder of One For All?',                                           a:['Nana Shimura','All Might','Yoichi Shigaraki','Kudo'],                                    c:2},
  {cat:'Chainsaw Man',    q:'What is the name of the chainsaw devil Denji merges with?',                                          a:['Gun Devil','Bat Devil','Pochita','Blood Devil'],                                         c:2},
  {cat:'Re:Zero',         q:'What is the name of Subaru\'s ability that activates when he dies?',                                 a:['Time Reset','Return by Death','Respawn','Witch\'s Blessing'],                           c:1},
  {cat:'Tokyo Ghoul',     q:'What type of kagune does Kaneki develop — described like spider legs?',                              a:['Ukaku','Koukaku','Bikaku','Rinkaku'],                                                    c:3},
  {cat:'Vinland Saga',    q:'What is the name of the legendary Viking warrior who is Thorfinn\'s father?',                        a:['Askeladd','Floki','Thors','Bjorn'],                                                     c:2},
  {cat:'Mob Psycho 100',  q:'What percentage does Mob reach when he experiences extreme sadness?',                                a:['???%','100%','70%','0%'],                                                                c:0},
  {cat:'Sword Art Online',q:'What is the name of the sword skill Kirito uses that involves two swords?',                          a:['Starburst Stream','Dual Blades','The Eclipse','Star Splash'],                           c:0},
  {cat:'Cowboy Bebop',    q:'What is the name of Spike\'s former syndicate he left before joining the Bebop?',                    a:['Red Dragon','White Tiger','Black Snake','Blue Wolf'],                                    c:0},
];

const WIN_SCORE = 7;
let p1name, p2name, p1score, p2score, round;
let qPool, qi, locked, answered, buzzedBy;
let timer = null, tLeft = 0;

function screen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startGame() {
  p1name  = document.getElementById('p1-name').value.trim() || 'Player 1';
  p2name  = document.getElementById('p2-name').value.trim() || 'Player 2';
  p1score = 0; p2score = 0; round = 0;
  document.getElementById('sc1-name').textContent = p1name;
  document.getElementById('sc2-name').textContent = p2name;
  qPool = [...QUESTIONS].sort(() => Math.random() - 0.5);
  qi = 0;
  screen('s-game');
  loadQ();
}

function loadQ() {
  clearInterval(timer);
  locked = false; answered = false; buzzedBy = 0;
  document.getElementById('q-card').className = 'q-card';
  setStatus('⚡ Press <kbd>Q</kbd> or <kbd>P</kbd> to buzz in!', null);
  tLeft = 15;
  document.getElementById('timer-fill').style.width = '100%';
  document.getElementById('timer-fill').style.background = 'linear-gradient(90deg,var(--p1),var(--p2))';
  document.getElementById('sc1').className = 'score-card';
  document.getElementById('sc2').className = 'score-card';
  round++;
  document.getElementById('round-info').textContent = `Round ${round}`;
  updateScores();
  const q = qPool[qi % qPool.length];
  document.getElementById('q-cat').textContent = q.cat.toUpperCase();
  document.getElementById('question').textContent = q.q;
  const opts = document.getElementById('opts');
  opts.innerHTML = '';
  const keys = ['1','2','3','4'];
  q.a.forEach((a, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.disabled = true;
    b.innerHTML = `<span class="key-badge">${keys[i]}</span> ${a}`;
    b.onclick = () => pick(i, q.c);
    opts.appendChild(b);
  });
  startCountdown();
}

function startCountdown() {
  const fill = document.getElementById('timer-fill');
  timer = setInterval(() => {
    tLeft -= 0.1;
    fill.style.width = Math.max(0, tLeft/15*100) + '%';
    if (tLeft <= 5) fill.style.background = '#ff3d5a';
    if (tLeft <= 0) {
      clearInterval(timer);
      if (!answered) {
        answered = true;
        setStatus('⏱ Time\'s up! No one scored.', null);
        revealAnswer();
        setTimeout(nextQ, 2200);
      }
    }
  }, 100);
}

function buzz(player) {
  if (locked || answered) return;
  locked = true; buzzedBy = player;
  clearInterval(timer);
  document.getElementById('q-card').classList.add('buzz-active', player===1 ? 'locked-p1' : 'locked-p2');
  document.getElementById(`sc${player}`).classList.add('buzzing', player===1 ? 'p1c' : 'p2c');
  const name = player===1 ? p1name : p2name;
  setStatus(`🔔 ${name} buzzed in! Answer with 1 2 3 4`, player);
  document.querySelectorAll('.opt').forEach(b => b.disabled = false);
  tLeft = 10;
  document.getElementById('timer-fill').style.width = '100%';
  document.getElementById('timer-fill').style.background = player===1 ? 'var(--p1)' : 'var(--p2)';
  timer = setInterval(() => {
    tLeft -= 0.1;
    document.getElementById('timer-fill').style.width = Math.max(0,tLeft/10*100)+'%';
    if (tLeft <= 0) {
      clearInterval(timer);
      if (!answered) {
        answered = true;
        const other = player===1 ? 2 : 1;
        if (player===1) p2score++; else p1score++;
        setStatus(`⌛ Too slow! +1 point to ${other===1?p1name:p2name}`, other);
        revealAnswer();
        updateScores();
        setTimeout(() => checkWin() || nextQ(), 2200);
      }
    }
  }, 100);
}

function pick(chosen, correct) {
  if (answered) return;
  answered = true;
  clearInterval(timer);
  document.querySelectorAll('.opt').forEach(b => b.disabled = true);
  const btns = document.querySelectorAll('.opt');
  btns[chosen].classList.add(chosen===correct ? 'correct' : 'wrong');
  btns[correct].classList.add('correct');
  if (chosen===correct) {
    if (buzzedBy===1) p1score++; else p2score++;
    const name = buzzedBy===1 ? p1name : p2name;
    setStatus(`✓ Correct! +1 point to ${name}`, buzzedBy);
    confetti(buzzedBy===1 ? '#6c63ff' : '#ff3d5a');
  } else {
    const other = buzzedBy===1 ? 2 : 1;
    if (buzzedBy===1) p2score++; else p1score++;
    const otherName = other===1 ? p1name : p2name;
    setStatus(`✗ Wrong! +1 point to ${otherName} (steal!)`, other);
  }
  updateScores();
  setTimeout(() => checkWin() || nextQ(), 2200);
}

function nextQ() { qi++; loadQ(); }

function revealAnswer() {
  const q = qPool[qi % qPool.length];
  document.querySelectorAll('.opt').forEach((b,i) => {
    b.disabled = true;
    if (i===q.c) b.classList.add('correct');
  });
}

function checkWin() {
  if (p1score >= WIN_SCORE || p2score >= WIN_SCORE) {
    clearInterval(timer);
    const winner = p1score >= WIN_SCORE ? p1name : p2name;
    const loser  = p1score >= WIN_SCORE ? p2name : p1name;
    document.getElementById('win-name').textContent = `${winner} Wins!`;
    document.getElementById('win-sub').textContent  = `${winner} defeated ${loser}. GG!`;
    document.getElementById('fc1-name').textContent  = p1name;
    document.getElementById('fc2-name').textContent  = p2name;
    document.getElementById('fc1-score').textContent = p1score;
    document.getElementById('fc2-score').textContent = p2score;
    document.getElementById('fc1').className = 'final-card' + (p1score>p2score?' winner':'');
    document.getElementById('fc2').className = 'final-card' + (p2score>p1score?' winner':'');
    confetti('#f0c040', true);
    setTimeout(() => screen('s-win'), 800);
    return true;
  }
  return false;
}

function updateScores() {
  document.getElementById('sc1-num').textContent = p1score;
  document.getElementById('sc2-num').textContent = p2score;
}

function setStatus(html, player) {
  const bar = document.getElementById('status-bar');
  const col = player===1 ? 'var(--p1)' : player===2 ? 'var(--p2)' : '#5a5a78';
  bar.innerHTML = player ? `<div class="dot" style="background:${col}"></div>${html}` : html;
  bar.style.color = player ? col : 'var(--text)';
}

function rematch()  { p1score=0; p2score=0; round=0; qPool=[...QUESTIONS].sort(()=>Math.random()-.5); qi=0; screen('s-game'); loadQ(); }
function goLobby()  { clearInterval(timer); screen('s-lobby'); }

function confetti(color, big=false) {
  const n = big ? 140 : 50;
  const extras = ['#6c63ff','#ff3d5a','#f0c040','#22c55e','#fff'];
  for (let i=0;i<n;i++) {
    setTimeout(()=>{
      const p=document.createElement('div');
      const s=Math.random()*12+5;
      p.className='prt';
      p.style.cssText=`width:${s}px;height:${s}px;background:${Math.random()>.4?color:extras[Math.floor(Math.random()*extras.length)]};left:${Math.random()*100}vw;top:-10px;border-radius:${Math.random()>.5?'50%':'2px'}`;
      document.body.appendChild(p);
      setTimeout(()=>p.remove(),1600);
    },i*(big?7:14));
  }
}

// ── KEYBOARD ──────────────────────────────────────────────
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k==='q') buzz(1);
  if (k==='p') buzz(2);
  if (['1','2','3','4'].includes(k) && locked && !answered) {
    document.querySelectorAll('.opt')[+k-1]?.click();
  }
});
</script>
</body>
</html>
